name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked
      - name: Test
        run: cargo test --locked
      # dissect.evidence's test images are AGPL: downloaded, not copied in.
      - name: Test on dissect.evidence's images
        run: |
          dir="$RUNNER_TEMP/ad1"
          mkdir -p "$dir"
          for name in test long compressed; do
            curl -sSfL -o "$dir/$name.ad1" "https://media.githubusercontent.com/media/fox-it/dissect.evidence/b2d1ac23288a0a77b1e6158b2dfcad0c945c5d2d/tests/_data/ad1/$name.ad1"
          done
          SOOTMARK_AD1_IMAGES="$dir" cargo test --locked --test images
      - name: Docs
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build for wasm32
        run: cargo build --locked --target wasm32-unknown-unknown

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
