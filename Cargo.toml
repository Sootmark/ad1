[package]
name = "sootmark-ad1"
version = "0.1.2"
edition = "2021"
rust-version = "1.80"
description = "AccessData AD1 logical images (FTK Imager custom content images): items, metadata, streamed content, segments."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/ad1"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "ad1", "ftk", "evidence"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "ad1"

[dependencies]
common = { package = "sootmark-common", version = "0.3.4" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
